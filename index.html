<!DOCTYPE html>
<html lang="fr">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carte - IAV Hassan II</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <style>
    html, body { height: 100%; margin: 0; font-family: "Segoe UI", Arial, sans-serif; }
    #map { height: 100%; width: 100%; }

    /* Bandeau de titre */
    .titre {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      z-index: 1000; background: #1b5e20; color: #fff;
      padding: 8px 20px; border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.3); font-size: 15px; font-weight: 600;
    }

    /* Popup arrondi */
    .leaflet-popup-content-wrapper { border-radius: 10px; }
    .leaflet-popup-content b { color: #1b5e20; }
  </style>
</head>
<body>

<div class="titre">Institut Agronomique et Vétérinaire Hassan II – Rabat</div>
<div id="map"></div>

<script>
  // Coordonnées approximatives de l'IAV Hassan II (Madinat Al Irfane, Rabat)
  const iav = [33.9716, -6.8648];

  const map = L.map('map').setView(iav, 16);

  // Fonds de carte (gratuits, sans clé API)
  const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  const satellite = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    attribution: 'Tiles &copy; Esri'
  });

  const relief = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    maxZoom: 17,
    attribution: '&copy; OpenStreetMap, SRTM | &copy; OpenTopoMap'
  });

  L.control.layers({
    "OpenStreetMap": osm,
    "Satellite": satellite,
    "Relief": relief
  }).addTo(map);
  L.control.scale({ metric: true, imperial: false }).addTo(map);

  // Marqueur personnalisé (icône ronde verte)
  const icone = L.divIcon({
    className: '',
    html: '<div style="background:#2e7d32;width:22px;height:22px;border-radius:50%;' +
          'border:3px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.5);"></div>',
    iconSize: [22, 22],
    iconAnchor: [11, 11]
  });

  L.marker(iav, { icon: icone }).addTo(map)
    .bindPopup('<b>IAV Hassan II</b><br>Institut Agronomique et Vétérinaire<br>Rabat, Maroc')
    .openPopup();

  // Zone d'influence autour de l'institut
  L.circle(iav, {
    color: '#2e7d32',
    fillColor: '#66bb6a',
    fillOpacity: 0.2,
    weight: 2,
    radius: 300
  }).addTo(map).bindPopup('Rayon de 300 m autour de l\'IAV');

  // Clic sur la carte : affiche les coordonnées
  const popup = L.popup();
  map.on('click', e => {
    popup.setLatLng(e.latlng)
         .setContent(`Coordonnées : ${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`)
         .openOn(map);
  });
</script>

</body>
</html>
